name: logic
# NOT generated by `brotea quality sync` — that owns ci.yml, and the test script
# it materialises is the same string for every React app in the fleet, so it
# cannot know about this repo's TypeScript unit tests.
#
# Without this file those 42 assertions run only on the machine of whoever
# remembers, which is the definition of a test that is not a gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The loader strips the types so `node --test` can import .ts directly:
      # this Node has no TypeScript support of its own.
      - name: Unit tests (settings, priority, today, integrations)
        run: |
          node --import ./scripts/ts-test-register.mjs --test \
            src/lib/*.test.mjs src/crm/*.test.mjs \
            src/features/today/*.test.mjs src/integrations/*.test.mjs
