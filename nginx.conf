# A single-page app has one HTML file and many URLs. Without this, nginx looks
# for a file called `hoy` and answers 404 — so every route except `/` dies on a
# refresh, on a shared link, and on the way back from the identity provider.
#
# Found by opening the deployed CRM at /hoy and reading the 404 (2026-08-15).
# The router had always worked in-app, which is exactly why nobody noticed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The bundle is content-hashed, so it can be cached hard and forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NOT be cached: it is the file that names the current bundle,
  # and a stale copy points at assets that no longer exist after a deploy.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Anything else: the file if it exists, otherwise the app, which reads the URL
  # and renders the right screen itself.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
